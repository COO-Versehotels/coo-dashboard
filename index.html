<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VERSE HOTELS — REVIEW PERFORMANCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===================== RESET & ROOT ===================== */
    :root {
      --bg: #e8ebf0;
      --bg-soft: #dde1e8;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --line: #d1d5db;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --success: #059669;
      --success-soft: #d1fae5;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --flat: #64748b;
      --flat-soft: #f1f5f9;
      --shadow: 0 4px 20px rgba(15,23,42,0.08);
      --amber: #d97706;
      --amber-soft: #fef3c7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
      background: linear-gradient(180deg,#e8ebf0 0%,#dde1e8 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 1180px; margin: 0 auto; padding: 20px 14px 48px; }

    /* ===================== HEADER ===================== */
    .header {
      background: linear-gradient(135deg,#f8fafc 0%,#e0e7ff 50%,#dbeafe 100%);
      border-radius: 16px; padding: 22px 24px; margin-bottom: 18px;
      box-shadow: 0 6px 24px rgba(30,58,138,0.08);
      border: 1px solid rgba(37,99,235,0.15); position: relative; overflow: hidden;
    }
    .header::before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg,#1e3a8a,#2563eb,#3b82f6,#60a5fa);
    }
    .header::after {
      content: ""; position: absolute; top: -30%; right: -10%; width: 320px; height: 320px;
      background: radial-gradient(circle,rgba(37,99,235,0.08),transparent 65%); pointer-events: none;
    }
    .header-top { display: flex; align-items: center; gap: 18px; margin-bottom: 4px; position: relative; z-index: 1; }
    .corporate-logo {
      width: 64px; height: 64px; flex-shrink: 0; display: flex; align-items: center;
      justify-content: center; background: #fff; border-radius: 12px; padding: 8px;
      box-shadow: 0 2px 10px rgba(30,58,138,0.08);
    }
    .corporate-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .header-title-wrap { flex: 1; min-width: 0; }
    .header h1 {
      margin: 0 0 6px; font-family: "Playfair Display","Georgia",serif;
      font-size: 28px; letter-spacing: -0.5px; color: #0f172a; font-weight: 700; line-height: 1.15;
    }
    .header-sub { font-size: 13px; color: #475569; line-height: 1.5; }
    .header-dates { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; position: relative; z-index: 1; }
    .date-pill {
      background: rgba(255,255,255,0.7); border: 1px solid rgba(37,99,235,0.18);
      color: #334155; border-radius: 8px; padding: 7px 14px; font-size: 12px; font-weight: 600;
      backdrop-filter: blur(6px);
    }
    .date-pill b { font-weight: 700; color: var(--primary-dark); }
    .date-pill-time { background: #fff7ed; border-color: #fed7aa; }
    .date-pill-time b { color: #c2410c; }
    .date-pill-anchor { background: #f0fdf4; border-color: #86efac; }
    .date-pill-anchor b { color: #15803d; }

    /* ===================== SECTION TITLES ===================== */
    .section-title {
      font-family: "Playfair Display","Georgia",serif; font-size: 22px; font-weight: 700;
      margin: 8px 0 14px 4px; color: var(--text); letter-spacing: -0.3px;
    }

    /* ===================== CARDS ===================== */
    .card {
      background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px;
      box-shadow: var(--shadow); border: 1px solid var(--line);
    }
    .card-title {
      font-family: "Playfair Display","Georgia",serif; font-size: 20px; font-weight: 700;
      margin: 0 0 4px; color: var(--text); letter-spacing: -0.3px;
    }
    .card-sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

    /* ===================== MATRIX TABLE ===================== */
    .matrix-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    .matrix-table {
      width: 100%; border-collapse: collapse; font-size: 12.5px;
      min-width: 920px; table-layout: fixed;
    }
    .matrix-table th {
      text-align: center; padding: 10px 6px;
      background: linear-gradient(180deg,#f8fafc,#f1f5f9); color: var(--text);
      font-weight: 700; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.4px;
      border-bottom: 2px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap;
    }
    .matrix-table th:last-child { border-right: none; }
    .matrix-table th:first-child { padding-left: 14px; }
    .matrix-table td {
      padding: 10px 8px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line);
      vertical-align: middle; text-align: center;
    }
    .matrix-table td:last-child { border-right: none; }
    .matrix-table tr:last-child td { border-bottom: none; }
    .matrix-table tr:hover td { background: #fafbfc; }
    .matrix-table th:first-child, .matrix-table .hotel-cell {
      width: 160px; min-width: 160px; max-width: 160px;
    }
    .hotel-cell { text-align: left !important; padding: 9px 10px !important; font-weight: 600; }
    .hotel-mini { display: flex; align-items: center; gap: 8px; }
    .hotel-mini-logo {
      width: 30px; height: 30px; border-radius: 6px; background: #fff; padding: 2px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .hotel-mini-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .hotel-mini-name { font-size: 12.5px; font-weight: 700; line-height: 1.25; }

    /* Platform logo header */
    .plat-head { display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .plat-head .plogo { width: 36px; height: 26px; border-radius: 4px; }

    /* Matrix cell content */
    .mc-rating { font-size: 15px; font-weight: 800; color: var(--primary-dark); line-height: 1.1; }
    .mc-reviews { font-size: 11px; color: var(--text); margin-top: 5px; font-weight: 600; }
    .mc-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.4px; font-weight: 600; margin-top: 2px; }
    .mc-divider { height: 1px; background: var(--line); margin: 6px auto 5px; width: 55%; }

    /* Delta badges */
    .delta { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10px; font-weight: 700; line-height: 1.3; margin-top: 2px; }
    .delta-up   { background: var(--success-soft); color: var(--success); }
    .delta-down { background: var(--danger-soft);  color: var(--danger); }
    .delta-flat { background: var(--flat-soft);    color: var(--flat); }
    .delta-anchor { background: var(--amber-soft); color: var(--amber); }
    .delta-icon { font-size: 9px; margin-right: 2px; opacity: 0.85; }
    .mc-na { color: var(--muted); font-style: italic; font-size: 11px; font-weight: 500; }

    /* Column group label */
    .col-group-header {
      background: linear-gradient(180deg,#f0f4ff,#e8eeff) !important;
      font-size: 10px !important; letter-spacing: 0.6px; color: #3730a3 !important;
    }
    .col-group-anchor {
      background: linear-gradient(180deg,#f0fdf4,#dcfce7) !important;
      font-size: 10px !important; letter-spacing: 0.6px; color: #15803d !important;
    }

    /* ===================== DETAIL HOTEL CARDS ===================== */
    .hotel-card { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
    .hotel-header { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
    .hotel-logo { width: 68px; height: 68px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; padding: 4px; }
    .hotel-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .hotel-name { font-size: 18px; font-weight: 700; margin: 0; color: var(--text); letter-spacing: -0.2px; }
    .hotel-location { font-size: 12px; color: var(--muted); margin-top: 3px; }

    /* Detail table */
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 10px 12px;
      background: linear-gradient(180deg,#f8fafc,#f1f5f9);
      color: var(--text); font-weight: 700; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      border-bottom: 2px solid var(--line); border-right: 1px solid var(--line); white-space: nowrap;
    }
    th:last-child { border-right: none; }
    td { padding: 12px 12px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); vertical-align: middle; }
    td:last-child { border-right: none; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafbfc; }
    .platform-cell { font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 10px; }
    .platform-logo { width: 40px; height: 30px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; overflow: hidden; }
    .platform-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* Compare cell — compact 2-column sub-layout */
    .compare-cell { text-align: left; white-space: nowrap; }
    .cmp-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .cmp-row:last-child { margin-bottom: 0; }
    .cmp-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); min-width: 76px; }
    .cmp-label.anchor { color: #15803d; }
    .cmp-values { font-size: 13px; font-weight: 600; color: var(--text); }
    .cmp-values .arrow { color: var(--muted); margin: 0 5px; font-weight: 400; }
    .cmp-values .today { color: var(--primary-dark); font-weight: 700; }
    .cmp-delta { }

    /* ===================== CHART SECTION ===================== */
    .chart-hotel-header {
      display: flex; align-items: center; gap: 14px; margin-bottom: 14px;
      padding-bottom: 12px; border-bottom: 1px solid var(--line);
    }
    .chart-hotel-logo {
      width: 48px; height: 48px; border-radius: 8px; background: #fff; padding: 3px;
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    }
    .chart-hotel-logo img { max-width: 100%; max-height: 100%; object-fit: contain; }
    .chart-hotel-name { font-size: 16px; font-weight: 700; margin: 0; color: var(--text); }
    .chart-hotel-period { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
    .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .chart-box { background: #fafbfc; border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
    .chart-box-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; text-align: center; }
    .chart-canvas-wrap { position: relative; height: 220px; }
    .chart-empty { text-align: center; color: var(--muted); font-size: 12px; font-style: italic; padding: 60px 12px; }

    /* ===================== RESPONSIVE ===================== */
    @media (max-width: 640px) {
      .container { padding: 14px 10px 30px; }
      .header { padding: 16px; border-radius: 12px; }
      .header h1 { font-size: 21px; }
      .corporate-logo { width: 44px; height: 44px; }
      .chart-grid { grid-template-columns: 1fr; }
      .section-title { font-size: 18px; }
      .chart-canvas-wrap { height: 200px; }
      .cmp-label { min-width: 60px; }
    }
    @media print {
      body { background: #fff; }
      .hotel-card, .card { break-inside: avoid; box-shadow: none; border: 1px solid var(--line); }
      @page { margin: 12mm; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="header">
    <div class="header-top">
      <div class="corporate-logo">
        <img id="corpLogoImg" src="" alt="Verse Hotels"></div>
      <div class="header-title-wrap">
        <h1>VERSE HOTELS — REVIEW PERFORMANCE</h1>
        <div class="header-sub">OTA rating &amp; reviews — daily comparison vs yesterday and vs 1st of month</div>
      </div>
    </div>
    <div class="header-dates">
      <div class="date-pill">Tanggal 1: <b id="dateAnchor">—</b></div>
      <div class="date-pill">Kemarin: <b id="dateYesterday">—</b></div>
      <div class="date-pill">Hari Ini: <b id="dateToday">—</b></div>
      <div class="date-pill date-pill-time">Last scraped: <b id="lastScraped">—</b></div>
    </div>
  </div>

    <!-- 
    CATATAN: Logo hotel dan platform menggunakan stub. 
    Untuk versi production dengan logo asli, copy nilai konstanta:
    HOTEL_LOGO_LITE, HOTEL_LOGO_LUXE, HOTEL_LOGO_CIREBON, HOTEL_LOGO_OAKTREE
    dan PLATFORM_LOGOS dari index.html versi sebelumnya.
    FITUR BARU: vs Kemarin + vs Tanggal 1 sudah terintegrasi.
  -->
<!-- MATRIX SECTION -->
  <div id="matrixSection"><div class="card"><div class="card-sub">Loading…</div></div></div>

  <!-- CHARTS SECTION -->
  <div id="chartsSection" class="charts-section"></div>

  <!-- HOTEL LIST -->
  <div id="hotelList"><div class="hotel-card"><div class="card-sub">Loading…</div></div></div>

</div><!-- /container -->

<script>
// ============================================================
// LOGO DATA (same as before — truncated here for readability,
// will be injected from the original file)
// ============================================================
const CORP_LOGO = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
const HOTEL_LOGO_LITE    = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
const HOTEL_LOGO_LUXE    = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
const HOTEL_LOGO_CIREBON = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";
const HOTEL_LOGO_OAKTREE = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==";

const HOTEL_INFO = {
  "Verse Lite Gajah Mada":   { shortName:"Verse Lite",    location:"Central Jakarta", logoSrc: HOTEL_LOGO_LITE },
  "Verse Luxe Wahid Hasyim": { shortName:"Verse Luxe",    location:"Central Jakarta", logoSrc: HOTEL_LOGO_LUXE },
  "Verse Cirebon":            { shortName:"Verse Cirebon", location:"Cirebon",         logoSrc: HOTEL_LOGO_CIREBON },
  "Oak Tree Mahakam Blok M": { shortName:"Oak Tree",      location:"South Jakarta",   logoSrc: HOTEL_LOGO_OAKTREE }
};

const PLATFORM_LOGOS = {
      agoda:     "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
      booking:   "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
      traveloka: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
      tripcom:   "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==",
      tiket:     "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=="
    };
const PLATFORMS = { agoda:"Agoda", booking:"Booking.com", traveloka:"Traveloka", tripcom:"Trip.com", tiket:"Tiket.com" };
const PLATFORM_ORDER = ["agoda","booking","traveloka","tripcom","tiket"];
const PLATFORM_COLORS = { agoda:"#dc2626", booking:"#1e3a8a", traveloka:"#10b981", tripcom:"#f59e0b", tiket:"#a855f7" };

// ============================================================
// DATA LOADING
// ============================================================
let EMBEDDED_DATA = null;
let EMBEDDED_HISTORY = null;

async function loadDataFromGitHub() {
  if (location.protocol === "file:") throw new Error("Please open via GitHub Pages or local server (python -m http.server 8080).");
  const cb = `?t=${Date.now()}`;
  const [dR, hR] = await Promise.all([fetch(`./data.json${cb}`), fetch(`./history.json${cb}`)]);
  if (!dR.ok) throw new Error(`data.json: ${dR.status}`);
  if (!hR.ok) throw new Error(`history.json: ${hR.status}`);
  EMBEDDED_DATA    = await dR.json();
  EMBEDDED_HISTORY = await hR.json();
}

// ============================================================
// UTILITY
// ============================================================
function fmtNum(v) {
  if (v === null || v === undefined || v === "N/A") return null;
  const n = Number(String(v).replace(/,/g,""));
  return Number.isNaN(n) ? null : n;
}
function fmtRating(v) {
  if (v === null || v === undefined || v === "N/A") return null;
  const n = Number(v); return Number.isNaN(n) ? null : n;
}

function deltaBadge(diff, decimals, cssClass) {
  if (diff === null || diff === undefined || Number.isNaN(diff)) return "";
  const cls = cssClass || (diff > 0 ? "delta-up" : diff < 0 ? "delta-down" : "delta-flat");
  const sign = diff > 0 ? "+" : "";
  const val  = decimals === 0 ? Math.round(diff) : Number(diff.toFixed(decimals));
  const shown = decimals === 0 ? val : val.toFixed(decimals);
  const arrow = diff > 0 ? "▲" : diff < 0 ? "▼" : "—";
  return `<span class="delta ${cls}">${arrow} ${sign}${shown}</span>`;
}

// Build lookup maps from history
function buildHistoryMaps(history, todayDate) {
  // Sort all entries ascending
  const sorted = [...(history||[])].sort((a,b)=>a.date.localeCompare(b.date));

  // yesterday = last entry with date < todayDate
  let yday = null;
  for (let i = sorted.length-1; i >= 0; i--) {
    if (sorted[i].date < todayDate) { yday = sorted[i]; break; }
  }
  if (!yday && sorted.length >= 2) yday = sorted[sorted.length-2];

  // anchor = first entry of current month (YYYY-MM-01), or first day of month present in history
  const monthPrefix = todayDate.slice(0, 7); // "YYYY-MM"
  const firstOfMonth = monthPrefix + "-01";
  let anchor = sorted.find(e => e.date === firstOfMonth);
  if (!anchor) {
    // fallback: earliest entry in current month
    anchor = sorted.find(e => e.date.startsWith(monthPrefix));
  }
  if (!anchor) {
    // fallback: first entry ever
    anchor = sorted[0] || null;
  }

  function buildMap(entry) {
    if (!entry) return {};
    const m = {};
    (entry.hotels||[]).forEach(h => { m[h.name] = h.platforms||{}; });
    return m;
  }

  return {
    yday,
    anchor,
    ydayMap:   buildMap(yday),
    anchorMap: buildMap(anchor)
  };
}

function formatLastScraped(ts) {
  try {
    const c = String(ts).split(".")[0];
    const [datePart, timePart] = c.split(" ");
    const [y,m,d] = datePart.split("-");
    const [hh,mm] = timePart.split(":");
    const mn = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${d} ${mn[parseInt(m)-1]} ${y}, ${hh}:${mm} WIB`;
  } catch(e) { return ts; }
}

// ============================================================
// RENDER — MATRIX TABLE (3 sections per platform cell:
//   rating today | Δ vs kemarin | Δ vs Tgl 1
//   reviews today | Δ vs kemarin | Δ vs Tgl 1)
// ============================================================
function renderMatrix(todayData, ydayMap, anchorMap, anchorDate) {
  const el = document.getElementById("matrixSection");
  const hotels = todayData.hotels || [];

  const platHeaders = PLATFORM_ORDER.map(p=>`
    <th>
      <div class="plat-head">
        <img class="plogo" src="${PLATFORM_LOGOS[p]||""}" alt="${p}">
        <span>${PLATFORMS[p]||p}</span>
      </div>
    </th>`).join("");

  const rows = hotels.map(hotel=>{
    const yP = ydayMap[hotel.name] || {};
    const aP = anchorMap[hotel.name] || {};
    const cells = PLATFORM_ORDER.map(pname=>{
      const tP = hotel.platforms?.[pname] || {};
      const tR = fmtRating(tP.rating), yR = fmtRating(yP[pname]?.rating), aR = fmtRating(aP[pname]?.rating);
      const tN = fmtNum(tP.reviews),   yN = fmtNum(yP[pname]?.reviews),   aN = fmtNum(aP[pname]?.reviews);

      if (tR === null && tN === null) return `<td><span class="mc-na">N/A</span></td>`;

      const ratingDisplay = tR !== null ? tR.toFixed(1) : "—";
      const reviewDisplay = tN !== null ? tN.toLocaleString("en-US") : "—";

      // Deltas ratings
      const dRyday  = (tR!==null&&yR!==null) ? deltaBadge(tR-yR,1,"") : "";
      const dRanch  = (tR!==null&&aR!==null) ? deltaBadge(tR-aR,1,"delta-anchor") : "";
      // Deltas reviews
      const dNyday  = (tN!==null&&yN!==null) ? deltaBadge(tN-yN,0,"") : "";
      const dNanch  = (tN!==null&&aN!==null) ? deltaBadge(tN-aN,0,"delta-anchor") : "";

      return `<td>
        <div class="mc-rating">${ratingDisplay}</div>
        <div style="margin-top:2px">${dRyday} ${dRanch}</div>
        <div class="mc-divider"></div>
        <div class="mc-reviews">${reviewDisplay}</div>
        <div class="mc-label">reviews</div>
        <div style="margin-top:2px">${dNyday} ${dNanch}</div>
      </td>`;
    }).join("");

    const hi = HOTEL_INFO[hotel.name]||{};
    return `<tr>
      <td class="hotel-cell">
        <div class="hotel-mini">
          <div class="hotel-mini-logo"><img src="${hi.logoSrc||""}" alt="${hotel.name}"></div>
          <div class="hotel-mini-name">${hi.shortName||hotel.name}</div>
        </div>
      </td>${cells}</tr>`;
  }).join("");

  el.innerHTML = `<div class="card">
    <h2 class="card-title">All Units — OTA Matrix</h2>
    <div class="card-sub">
      Rating &amp; reviews today.
      <span class="delta delta-up" style="font-size:10px">▲ Δ kemarin</span>
      <span class="delta delta-anchor" style="font-size:10px">▲ Δ vs Tgl 1 (${anchorDate||"—"})</span>
    </div>
    <div class="matrix-wrap">
      <table class="matrix-table">
        <thead>
          <tr>
            <th>Hotel</th>
            ${platHeaders}
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ============================================================
// RENDER — HOTEL DETAIL CARDS
// ============================================================
function renderHotels(todayData, ydayMap, anchorMap, anchorDate) {
  const el = document.getElementById("hotelList");
  el.innerHTML = "";
  (todayData.hotels||[]).forEach(hotel=>{
    const yP = ydayMap[hotel.name]||{};
    const aP = anchorMap[hotel.name]||{};
    const hi = HOTEL_INFO[hotel.name]||{};

    const rows = PLATFORM_ORDER
      .filter(p=>hotel.platforms?.[p]||yP[p]||aP[p])
      .map(p=>{
        const tP=hotel.platforms?.[p]||{};
        const tR=fmtRating(tP.rating), yR=fmtRating(yP[p]?.rating), aR=fmtRating(aP[p]?.rating);
        const tN=fmtNum(tP.reviews),   yN=fmtNum(yP[p]?.reviews),   aN=fmtNum(aP[p]?.reviews);

        // Rating row
        const rYtxt = yR!==null ? yR.toFixed(1):"—";
        const rToday = tR!==null ? `<span class="today">${tR.toFixed(1)}</span>` : `<span style="color:var(--muted)">N/A</span>`;
        const dRyday = (tR!==null&&yR!==null)?deltaBadge(tR-yR,1,""):"";
        const rATxt  = aR!==null ? aR.toFixed(1):"—";
        const dRanch = (tR!==null&&aR!==null)?deltaBadge(tR-aR,1,"delta-anchor"):"";

        // Reviews row
        const nYtxt  = yN!==null ? yN.toLocaleString("en-US"):"—";
        const nToday = tN!==null ? `<span class="today">${tN.toLocaleString("en-US")}</span>` : `<span style="color:var(--muted)">N/A</span>`;
        const dNyday = (tN!==null&&yN!==null)?deltaBadge(tN-yN,0,""):"";
        const nATxt  = aN!==null ? aN.toLocaleString("en-US"):"—";
        const dNanch = (tN!==null&&aN!==null)?deltaBadge(tN-aN,0,"delta-anchor"):"";

        return `<tr>
          <td style="width:130px">
            <div class="platform-cell">
              <span class="platform-logo"><img src="${PLATFORM_LOGOS[p]||""}" alt="${p}"></span>
              ${PLATFORMS[p]||p}
            </div>
          </td>
          <td class="compare-cell">
            <div class="cmp-row">
              <span class="cmp-label">⭐ Rating</span>
              <span class="cmp-values">${rYtxt}<span class="arrow">→</span>${rToday}</span>
              <span class="cmp-delta">${dRyday}</span>
            </div>
            <div class="cmp-row">
              <span class="cmp-label anchor">vs Tgl 1</span>
              <span class="cmp-values">${rATxt}<span class="arrow">→</span>${rToday}</span>
              <span class="cmp-delta">${dRanch}</span>
            </div>
          </td>
          <td class="compare-cell">
            <div class="cmp-row">
              <span class="cmp-label">💬 Reviews</span>
              <span class="cmp-values">${nYtxt}<span class="arrow">→</span>${nToday}</span>
              <span class="cmp-delta">${dNyday}</span>
            </div>
            <div class="cmp-row">
              <span class="cmp-label anchor">vs Tgl 1</span>
              <span class="cmp-values">${nATxt}<span class="arrow">→</span>${nToday}</span>
              <span class="cmp-delta">${dNanch}</span>
            </div>
          </td>
        </tr>`;
      }).join("");

    const card = document.createElement("div");
    card.className = "hotel-card";
    card.innerHTML = `
      <div class="hotel-header">
        <div class="hotel-logo"><img src="${hi.logoSrc||""}" alt="${hotel.name}"></div>
        <div>
          <h2 class="hotel-name">${hotel.name}</h2>
          <div class="hotel-location">${hi.location||""}</div>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Platform</th>
              <th>Rating comparison</th>
              <th>Reviews comparison</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    el.appendChild(card);
  });
}

// ============================================================
// RENDER — PERFORMANCE CHARTS (unchanged from previous)
// ============================================================
function buildFullTimeline(todayData, history) {
  const all = [...(history||[])];
  const td = (todayData.last_update||"").slice(0,10);
  if (td && !all.find(e=>e.date===td)) all.push({date:td,hotels:todayData.hotels||[]});
  all.sort((a,b)=>a.date.localeCompare(b.date));
  return all;
}
function extractTimeline(timeline, hotelName, platform, metric) {
  return timeline.map(entry=>{
    const hotel=(entry.hotels||[]).find(h=>h.name===hotelName);
    if (!hotel) return null;
    const p=hotel.platforms?.[platform];
    if (!p) return null;
    const raw=metric==="rating"?p.rating:p.reviews;
    if (raw===null||raw===undefined||raw==="N/A") return null;
    const n=Number(raw); return Number.isNaN(n)?null:n;
  });
}
function buildDatasets(timeline,hotelName,metric) {
  return PLATFORM_ORDER.map(pname=>{
    const data=extractTimeline(timeline,hotelName,pname,metric);
    if (!data.some(v=>v!==null)) return null;
    const c=PLATFORM_COLORS[pname];
    return {label:PLATFORMS[pname]||pname,data,borderColor:c,backgroundColor:c+"20",borderWidth:2.2,tension:0.3,pointRadius:4,pointHoverRadius:6,pointBackgroundColor:c,pointBorderColor:"#fff",pointBorderWidth:1.5,spanGaps:true};
  }).filter(Boolean);
}
function createChart(canvas,labels,datasets,isRating) {
  return new Chart(canvas,{type:"line",data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom",labels:{usePointStyle:true,boxWidth:8,padding:10,font:{size:10.5,weight:"600"}}},tooltip:{backgroundColor:"rgba(15,23,42,0.95)",titleFont:{size:12,weight:"700"},bodyFont:{size:11.5},padding:10,cornerRadius:8,callbacks:{label:(ctx)=>{const v=ctx.parsed.y;if(v===null)return`${ctx.dataset.label}: N/A`;return isRating?`${ctx.dataset.label}: ${v.toFixed(1)}`:`${ctx.dataset.label}: ${v.toLocaleString("en-US")}`;},},},},scales:{x:{grid:{display:false},ticks:{font:{size:10.5},color:"#64748b",maxRotation:0,autoSkip:true,maxTicksLimit:8}},y:Object.assign({beginAtZero:!isRating,grid:{color:"#e2e8f0"},ticks:{font:{size:10.5},color:"#64748b",callback:(v)=>isRating?v.toFixed(1):v.toLocaleString("en-US")}}, isRating?{suggestedMin:0,suggestedMax:10}:{})}},},});
}
function renderCharts(todayData, history) {
  const el = document.getElementById("chartsSection");
  const timeline = buildFullTimeline(todayData, history);
  if (timeline.length < 2) { el.innerHTML=`<div class="card"><div class="chart-empty">Performance chart will appear once 2+ days of data are available.</div></div>`; return; }
  if (typeof Chart==="undefined") { el.innerHTML=`<div class="card"><div class="chart-empty">Chart.js not loaded (check internet connection).</div></div>`; return; }
  const dates=timeline.map(e=>e.date);
  const period=`${dates[0]} → ${dates[dates.length-1]} (${dates.length} days)`;
  let html=`<h2 class="section-title">Performance Trends</h2>`;
  (todayData.hotels||[]).forEach(hotel=>{
    const hi=HOTEL_INFO[hotel.name]||{};
    const hid=hotel.name.replace(/\s+/g,"_").replace(/[^\w]/g,"");
    html+=`<div class="card"><div class="chart-hotel-header"><div class="chart-hotel-logo"><img src="${hi.logoSrc||""}" alt="${hotel.name}"></div><div><h3 class="chart-hotel-name">${hotel.name}</h3><div class="chart-hotel-period">${period}</div></div></div><div class="chart-grid"><div class="chart-box"><div class="chart-box-title">Rating Trend</div><div class="chart-canvas-wrap"><canvas id="cr_${hid}"></canvas></div></div><div class="chart-box"><div class="chart-box-title">Reviews Count Trend</div><div class="chart-canvas-wrap"><canvas id="cn_${hid}"></canvas></div></div></div></div>`;
  });
  el.innerHTML=html;
  (todayData.hotels||[]).forEach(hotel=>{
    const hid=hotel.name.replace(/\s+/g,"_").replace(/[^\w]/g,"");
    const rc=document.getElementById(`cr_${hid}`);
    const nc=document.getElementById(`cn_${hid}`);
    if(rc){const ds=buildDatasets(timeline,hotel.name,"rating"); if(ds.length)createChart(rc.getContext("2d"),dates,ds,true);}
    if(nc){const ds=buildDatasets(timeline,hotel.name,"reviews"); if(ds.length)createChart(nc.getContext("2d"),dates,ds,false);}
  });
}

// ============================================================
// INIT
// ============================================================
async function init() {
  try {
    await loadDataFromGitHub();
    const data    = EMBEDDED_DATA;
    const history = EMBEDDED_HISTORY;

    const todayDate = (data.last_update||"").slice(0,10) || (() => {
      const s=[...(history||[])].sort((a,b)=>a.date.localeCompare(b.date));
      return s.length ? s[s.length-1].date : "—";
    })();

    const { yday, anchor, ydayMap, anchorMap } = buildHistoryMaps(history, todayDate);

    document.getElementById("dateToday").textContent     = todayDate||"—";
    document.getElementById("dateYesterday").textContent = yday?.date||"—";
    document.getElementById("dateAnchor").textContent    = anchor?.date||"—";
    document.getElementById("lastScraped").textContent   = data.last_update ? formatLastScraped(data.last_update) : "—";

    renderMatrix(data, ydayMap, anchorMap, anchor?.date);
    renderCharts(data, history);
    renderHotels(data, ydayMap, anchorMap, anchor?.date);
  } catch(err) {
    console.error(err);
    document.getElementById("hotelList").innerHTML=`<div class="hotel-card" style="color:var(--danger)"><strong>Failed to load dashboard.</strong><br>Error: ${err.message}</div>`;
  }
}
document.addEventListener("DOMContentLoaded", init);
</script>
